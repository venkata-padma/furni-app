services:
  - type: web
    name: furni-app
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      # SPA fallback: every path serves index.html so React Router can
      # handle client-side routes (e.g. /shop, /cart) on hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
